name: Build Pepswitch NRO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/stremio-addons

jobs:
  build-switch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build NRO in devkitpro container
        run: |
          docker run --platform linux/amd64 --rm \
            -v $(pwd):/data \
            devkitpro/devkita64:latest \
            bash -c "/data/scripts/build_switch.sh"

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp cmake-build-switch/TsVitch.nro dist/Pepswitch.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: Pepswitch-NintendoSwitch
          path: dist/Pepswitch.nro
          if-no-files-found: error
